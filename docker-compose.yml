services:
  shipments-db:
    image: postgres:17
    environment:
      POSTGRES_DB: shipments
      POSTGRES_USER: shipments
      POSTGRES_PASSWORD: shipments
    ports:
      - "5432:5432"
    volumes:
      - shipments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipments"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shipments-data:
