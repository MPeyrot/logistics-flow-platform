name: Deploy up

# Démo à la demande sur Cloud Run (spec #63) : lancé à la main par Michael, jamais automatiquement.
# Déploie un commit de main dont la CI est verte (services, puis front), puis lance le parcours de fumée.
# Les noms et identifiants viennent des variables du dépôt posées par scripts/deploy/setup-wizard.sh.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Amorcer des données de démo après la fumée (base vide : voir README, « Déployer »)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  checks: read
  statuses: read

# Un seul up ou down à la fois.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
  KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
  BOOTSTRAP_ADMIN_USERNAME: ${{ vars.BOOTSTRAP_ADMIN_USERNAME }}

jobs:
  up:
    name: Déployer ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Vérifier les variables du dépôt
        run: |
          for v in PROJECT_ID PROJECT_NUMBER REGION AR_REPOSITORY KAFKA_BOOTSTRAP_SERVERS BOOTSTRAP_ADMIN_USERNAME; do
            if [ -z "${!v}" ]; then echo "::error::Variable du dépôt manquante pour $v : lancer scripts/deploy/setup-wizard.sh"; exit 1; fi
          done
          if [[ "$BOOTSTRAP_ADMIN_USERNAME" == *"|"* ]]; then echo "::error::BOOTSTRAP_ADMIN_USERNAME ne doit pas contenir |"; exit 1; fi
          for v in GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            if [ -z "${!v}" ]; then echo "::error::Variable du dépôt manquante : $v"; exit 1; fi
          done
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}

      # Sans relancer les tests : on lit les résultats de ci.yml sur ce commit (API GitHub).
      - name: Vérifier que le commit est sur main et que sa CI est verte
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status="$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::Le commit $SHA n'est pas dans main (statut $status). Lancer le workflow depuis main."
            exit 1
          fi
          runs="$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name | startswith("Tests (") or startswith("ShellCheck (")) | "\(.name)\t\(.status)\t\(.conclusion)"')"
          echo "$runs"
          # Tous les jobs de ci.yml : les trois suites de tests et ShellCheck.
          for job in "Tests (shipment-service)" "Tests (ingestion-service)" "Tests (ai-service)" "ShellCheck (scripts)"; do
            if ! grep -qF "$job"$'\t'"completed"$'\t'"success" <<<"$runs"; then
              echo "::error::La CI n'est pas verte pour « $job » sur $SHA."
              exit 1
            fi
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : project-stats.json compte les commits

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/*/pom.xml

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Authentifier Docker auprès d'Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Images Paketo (spring-boot:build-image), sans les tests : la CI les a déjà passés.
      - name: Construire et pousser les trois images
        env:
          SHA: ${{ github.sha }}
        run: |
          for service in shipment-service ingestion-service ai-service; do
            image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${service}:${SHA}"
            (cd "services/$service" && ./mvnw -B -ntp -DskipTests package spring-boot:build-image "-Dimage.name=$image")
            docker push "$image"
          done

      # Chiffres de la page /projet : écrits dans frontend/public (ignoré par git), donc copiés dans l'image.
      - name: Générer les chiffres du projet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: frontend
        run: npm run stats

      # Le front est la seule image par Dockerfile (nginx non root) : écart assumé à Paketo.
      - name: Construire et pousser l'image du front
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/frontend:${SHA}"
          docker build -t "$image" frontend
          docker push "$image"

      - name: Déployer shipment-service
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ai_url="https://ai-service-${PROJECT_NUMBER}.${REGION}.run.app"
          # Séparateur ^|^ : SPRING_PROFILES_ACTIVE contient une virgule, et l'identifiant ADMIN ne peut pas contenir | (vérifié plus haut).
          gcloud run deploy shipment-service \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/shipment-service:${SHA}" \
            --service-account="shipment-service-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --min-instances=1 --max-instances=1 --no-cpu-throttling \
            --cpu=1 --memory=1Gi --cpu-boost --port=8080 \
            --startup-probe=httpGet.path=/actuator/health,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=48 \
            --allow-unauthenticated \
            --set-env-vars="^|^SPRING_PROFILES_ACTIVE=confluent,gcp|KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}|BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME}|AI_SERVICE_URL=${ai_url}" \
            --set-secrets="JWT_PRIVATE_KEY=JWT_PRIVATE_KEY:latest,BOOTSTRAP_ADMIN_PASSWORD=BOOTSTRAP_ADMIN_PASSWORD:latest,DB_URL=DB_URL:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,KAFKA_API_KEY=SHIPMENT_KAFKA_API_KEY:latest,KAFKA_API_SECRET=SHIPMENT_KAFKA_API_SECRET:latest"

      # Les deux autres services valident les jetons avec ce JWKS : on l'attend avant de les déployer.
      - name: Attendre le JWKS de shipment-service
        run: |
          set -euo pipefail
          url="$(gcloud run services describe shipment-service --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 -o /dev/null "$url/.well-known/jwks.json"; then
              echo "JWKS disponible (essai $attempt)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/.well-known/jwks.json ne répond pas après 5 minutes."
          exit 1

      - name: Déployer ingestion-service
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shipment_url="$(gcloud run services describe shipment-service --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          gcloud run deploy ingestion-service \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/ingestion-service:${SHA}" \
            --service-account="ingestion-service-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --min-instances=0 --max-instances=1 --cpu-throttling \
            --cpu=1 --memory=1Gi --cpu-boost --port=8080 \
            --startup-probe=httpGet.path=/actuator/health,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=48 \
            --allow-unauthenticated \
            --set-env-vars="^@^SPRING_PROFILES_ACTIVE=confluent,gcp@KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}@SHIPMENT_SERVICE_URL=${shipment_url}" \
            --set-secrets="KAFKA_API_KEY=INGESTION_KAFKA_API_KEY:latest,KAFKA_API_SECRET=INGESTION_KAFKA_API_SECRET:latest"

      - name: Déployer ai-service
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shipment_url="$(gcloud run services describe shipment-service --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          gcloud run deploy ai-service \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/ai-service:${SHA}" \
            --service-account="ai-service-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --min-instances=0 --max-instances=1 --cpu-throttling \
            --cpu=1 --memory=1Gi --cpu-boost --port=8080 \
            --startup-probe=httpGet.path=/actuator/health,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=48 \
            --allow-unauthenticated \
            --set-env-vars="^@^SPRING_PROFILES_ACTIVE=confluent,gcp@SHIPMENT_SERVICE_URL=${shipment_url}" \
            --set-secrets="ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"

      # Le front renvoie /api vers les deux services : il se déploie après eux, avec leurs URL.
      # Pas de sonde de démarrage : nginx démarre sans attendre les services (502 sur leurs routes seulement).
      - name: Déployer frontend
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url_of() { gcloud run services describe "$1" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)'; }
          shipment_url="$(url_of shipment-service)"
          ingestion_url="$(url_of ingestion-service)"
          gcloud run deploy frontend \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/frontend:${SHA}" \
            --service-account="frontend-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --min-instances=0 --max-instances=1 --cpu-throttling \
            --cpu=1 --memory=256Mi --port=8080 --timeout=300 \
            --allow-unauthenticated \
            --set-env-vars="SHIPMENT_SERVICE_URL=${shipment_url},INGESTION_SERVICE_URL=${ingestion_url}"

      # Au premier déploiement d'un service (après un down), le droit allUsers → run.invoker met jusqu'à
      # quelques minutes à se propager : le frontal Google répond alors 401/403 en HTML sans joindre le
      # service. On attend que chaque service réponde 200 sur /actuator/health, ouvert sans jeton.
      - name: Attendre l'accès public des services
        run: |
          set -euo pipefail
          for service in shipment-service ingestion-service ai-service; do
            url="$(gcloud run services describe "$service" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
            deadline=$((SECONDS + 300))
            until status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url/actuator/health")" && [ "$status" = "200" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$service ne répond pas 200 sur /actuator/health après 5 min (dernier statut : ${status:-aucun})."
                exit 1
              fi
              echo "$service : statut ${status:-aucun}, nouvel essai dans 5 s"
              sleep 5
            done
            echo "$service : accessible"
          done

      # Même attente pour le front (droit public propagé), sur sa page d'accueil.
      - name: Attendre l'accès public du front
        run: |
          set -euo pipefail
          url="$(gcloud run services describe frontend --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          deadline=$((SECONDS + 300))
          until status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url/")" && [ "$status" = "200" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::frontend ne répond pas 200 sur / après 5 min (dernier statut : ${status:-aucun})."
              exit 1
            fi
            echo "frontend : statut ${status:-aucun}, nouvel essai dans 5 s"
            sleep 5
          done
          echo "frontend : accessible"

      # Un échec de la fumée fait échouer le workflow. Aucun appel à Claude.
      - name: Parcours de fumée
        env:
          ADMIN_USERNAME: ${{ vars.BOOTSTRAP_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          url_of() { gcloud run services describe "$1" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)'; }
          SHIPMENT_URL="$(url_of shipment-service)"
          INGESTION_URL="$(url_of ingestion-service)"
          AI_URL="$(url_of ai-service)"
          FRONTEND_URL="$(url_of frontend)"
          export SHIPMENT_URL INGESTION_URL AI_URL FRONTEND_URL
          scripts/deploy/smoke.sh
          {
            echo "### Démo en ligne"
            echo "**URL de la démo : $FRONTEND_URL**"
            echo "- frontend : $FRONTEND_URL"
            echo "- shipment-service : $SHIPMENT_URL"
            echo "- ingestion-service : $INGESTION_URL"
            echo "- ai-service : $AI_URL"
            echo "Penser à lancer le workflow « Deploy down » après la démo."
          } >> "$GITHUB_STEP_SUMMARY"

      # Facultatif : expéditions plausibles pour la démo (scripts/deploy/seed-demo.sh), jamais un appel à Claude.
      - name: Amorçage des données de démo
        if: ${{ inputs.seed }}
        env:
          ADMIN_USERNAME: ${{ vars.BOOTSTRAP_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          url_of() { gcloud run services describe "$1" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)'; }
          SHIPMENT_URL="$(url_of shipment-service)"
          INGESTION_URL="$(url_of ingestion-service)"
          export SHIPMENT_URL INGESTION_URL
          scripts/deploy/seed-demo.sh
