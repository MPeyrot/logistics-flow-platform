# Kafka managé (Confluent Cloud) : SASL_SSL / PLAIN. KAFKA_BOOTSTRAP_SERVERS, KAFKA_API_KEY et KAFKA_API_SECRET
# viennent de l'environnement ; ConfluentCredentialsConfig refuse de démarrer si la clé ou le secret manque.
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY:}" password="${KAFKA_API_SECRET:}";
# Confluent Cloud refuse moins de 3 répliques.
kafka.topics.replicas=${KAFKA_TOPICS_REPLICAS:3}
