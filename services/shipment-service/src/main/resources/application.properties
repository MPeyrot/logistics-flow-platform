spring.application.name=shipment-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shipments}
spring.datasource.username=${DB_USER:shipments}
spring.datasource.password=${DB_PASSWORD:shipments}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Seul /actuator/health est exposé, et public ; tout autre point Actuator est fermé (SecurityConfig).
management.endpoints.web.exposure.include=health

# Clé privée RSA de signature des JWT (PEM PKCS#8), obligatoire. En local : scripts/generate-jwt-key.sh.
jwt.private-key=${JWT_PRIVATE_KEY:}
# Premier ADMIN, créé au démarrage si aucun n'existe.
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
# Force brute : 5 échecs de connexion en 15 min bloquent l'identifiant 15 min (429). Compteur en mémoire, par instance.
auth.login.max-failures=${AUTH_LOGIN_MAX_FAILURES:5}
auth.login.failure-window=${AUTH_LOGIN_FAILURE_WINDOW:15m}
auth.login.block-duration=${AUTH_LOGIN_BLOCK_DURATION:15m}
# Mémoire bornée : au plus 10 000 identifiants non bloqués suivis (les moins récemment vus oubliés d'abord) ;
# les bloqués à part, oubliés à la fin de leur blocage, au plus 100 000 (au-delà, celui qui finit le plus tôt).
auth.login.max-tracked-usernames=${AUTH_LOGIN_MAX_TRACKED_USERNAMES:10000}
auth.login.max-blocked-usernames=${AUTH_LOGIN_MAX_BLOCKED_USERNAMES:100000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=shipment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Scan reçu avant son expédition : nouvelles tentatives bloquantes, 1 s, ×2, plafond 60 s, ~5 min au total, puis DLT.
shipment.kafka.unknown-shipment.initial-interval=${UNKNOWN_SHIPMENT_INITIAL_INTERVAL:1s}
shipment.kafka.unknown-shipment.multiplier=${UNKNOWN_SHIPMENT_MULTIPLIER:2}
shipment.kafka.unknown-shipment.max-interval=${UNKNOWN_SHIPMENT_MAX_INTERVAL:60s}
shipment.kafka.unknown-shipment.max-elapsed-time=${UNKNOWN_SHIPMENT_MAX_ELAPSED_TIME:5m}
# Chaque attente (60 s au plus) se fait sans poll(). Vérifié au démarrage : la plus longue attente (ci-dessus, ou
# shipment.kafka.retry-interval-ms) plus la marge laissée au traitement des messages du lot qui précèdent l'échec
# (max.poll.records, 500 par défaut) reste sous max.poll.interval.ms.
shipment.kafka.batch-processing-margin=${KAFKA_BATCH_PROCESSING_MARGIN:60s}
spring.kafka.consumer.properties.max.poll.interval.ms=300000
# Un consommateur par partition de scan-events (3) : une attente ne gèle que sa partition, pas les deux autres.
spring.kafka.listener.concurrency=3
# Rejeux du DLT : enregistrés avec leur message dans une outbox, publiée toutes les secondes, 100 messages par lot.
shipment.kafka.dlt.outbox.interval=${DLT_OUTBOX_INTERVAL:1s}
shipment.kafka.dlt.outbox.batch-size=100
# Deux tâches planifiées (outbox des rejeux, détection des anomalies) : une longue passe ne retarde pas l'autre.
spring.task.scheduling.pool.size=2

# ai-service : extraction des bons de livraison. Lecture longue : l'API Claude peut mettre plusieurs secondes.
ai-service.base-url=${AI_SERVICE_URL:http://localhost:8082}
ai-service.connect-timeout=2s
ai-service.read-timeout=120s
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Chaque extraction coûte un appel à l'API Claude : 20 par heure et par utilisateur (429), compteur en mémoire, par instance.
extraction.rate-limit.max-per-window=${EXTRACTION_RATE_LIMIT_MAX:20}
extraction.rate-limit.window=${EXTRACTION_RATE_LIMIT_WINDOW:1h}

# Anomalies : détection planifiée sur chaque instance (première passe un intervalle après le démarrage).
# STALLED : aucun scan (ou création sans scan) depuis stalled-after ; LATE : date de livraison prévue dépassée.
shipment.anomaly.detection-interval=${ANOMALY_DETECTION_INTERVAL:15m}
shipment.anomaly.stalled-after=${ANOMALY_STALLED_AFTER:48h}
