spring.application.name=shipment-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shipments}
spring.datasource.username=${DB_USER:shipments}
spring.datasource.password=${DB_PASSWORD:shipments}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Seul /actuator/health est exposé, et public ; tout autre point Actuator est fermé (SecurityConfig).
management.endpoints.web.exposure.include=health

# Clé privée RSA de signature des JWT (PEM PKCS#8), obligatoire. En local : scripts/generate-jwt-key.sh.
jwt.private-key=${JWT_PRIVATE_KEY:}
# Premier ADMIN, créé au démarrage si aucun n'existe.
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=shipment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ai-service : extraction des bons de livraison. Lecture longue : l'API Claude peut mettre plusieurs secondes.
ai-service.base-url=${AI_SERVICE_URL:http://localhost:8082}
ai-service.connect-timeout=2s
ai-service.read-timeout=120s
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
