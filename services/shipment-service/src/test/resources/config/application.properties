# Surcharges des tests (#61). Tous les contextes Spring partagent un seul Kafka et un seul PostgreSQL : un contexte
# resté en cache ne doit ni consommer scan-events ni lancer l'outbox des rejeux sur la base commune. La détection des anomalies garde ses 15 min (test du défaut) :
# la suite dure moins.
# Les classes qui testent ces comportements les réactivent (voir @SpringBootTest(properties) et @DirtiesContext).
spring.kafka.listener.auto-startup=false
shipment.kafka.dlt.outbox.interval=1h
