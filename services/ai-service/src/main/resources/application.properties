spring.application.name=ai-service
server.port=${PORT:8082}
management.endpoints.web.exposure.include=health,info

# Appel à l'API Claude. La clé vient de l'environnement ; sans clé, l'extraction répond 503.
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.base-url=${ANTHROPIC_BASE_URL:}
# Haiku 5.5 par défaut : extractions aussi justes qu'Opus sur nos tests, ~35 fois moins cher (#9).
ai.claude.model=${AI_CLAUDE_MODEL:claude-haiku-5-5}
# Effort de réflexion : low suffit pour lire un document ; à remonter si l'extraction manque de précision.
ai.claude.effort=low
ai.claude.max-tokens=2048
ai.claude.max-retries=2
ai.claude.timeout=60s
# Tarif en dollars par million de jetons, à changer AVEC le modèle (sinon costUsd est faux).
# claude-haiku-5-5, prompts jusqu'à 100 000 jetons (au-delà : 0,50 / 2,50) : 0,10 / 0,50, cache écrit 0,125, cache lu 0,01.
# claude-opus-5-5 : 4 / 20 / 5 / 0,20 ; claude-sonnet-5-5 : 2 / 10 / 2,50 / 0,10.
ai.claude.pricing.input=0.10
ai.claude.pricing.output=0.50
ai.claude.pricing.cache-write=0.125
ai.claude.pricing.cache-read=0.01

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Authentification : jetons émis par shipment-service, clé publique lue sur son JWKS.
shipment-service.url=${SHIPMENT_SERVICE_URL:http://localhost:8080}
# Plafond global d'extractions (coût de l'API Claude), compteur en mémoire par instance.
ai.extraction.max-per-hour=${AI_EXTRACTION_MAX_PER_HOUR:100}
