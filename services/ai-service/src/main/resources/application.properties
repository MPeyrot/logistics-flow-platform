spring.application.name=ai-service
server.port=${PORT:8082}
management.endpoints.web.exposure.include=health,info

# Appel à l'API Claude. La clé vient de l'environnement ; sans clé, l'extraction répond 503.
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.base-url=${ANTHROPIC_BASE_URL:}
ai.claude.model=${AI_CLAUDE_MODEL:claude-opus-5-5}
# Effort de réflexion : low suffit pour lire un document ; à remonter si l'extraction manque de précision.
ai.claude.effort=low
ai.claude.max-tokens=2048
ai.claude.max-retries=2
ai.claude.timeout=60s
# Tarif en dollars par million de jetons, à tenir à jour avec le modèle choisi (claude-opus-5-5 : 4 / 20, cache lu 0,20).
# Écriture du cache = 1,25 x le prix d'entrée (durée de vie de 5 minutes).
ai.claude.pricing.input=4.00
ai.claude.pricing.output=20.00
ai.claude.pricing.cache-write=5.00
ai.claude.pricing.cache-read=0.20

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
