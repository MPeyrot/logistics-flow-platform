# Cloud Run : journaux JSON sur la console, lus par Cloud Logging (severity, message ; les paires clé-valeur
# de SLF4J, comme costUsd, deviennent des champs de premier niveau).
logging.structured.format.console=logstash
logging.structured.json.rename.level=severity
# Valeurs de niveau de Cloud Logging (WARN -> WARNING, TRACE -> DEBUG).
logging.structured.json.customizer=fr.michael.logistics.ingestion.infrastructure.logging.CloudLoggingSeverityCustomizer
