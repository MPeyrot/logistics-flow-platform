spring.application.name=ingestion-service
server.port=${PORT:8081}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
shipment-service.url=${SHIPMENT_SERVICE_URL:http://localhost:8080}
# L'import CSV est lancé par requête (job construit à chaque import), jamais au démarrage.
spring.batch.job.enabled=false
management.endpoints.web.exposure.include=health,info

# Nombre de répliques des topics déclarés au démarrage : 1 en local, 3 avec le profil confluent.
kafka.topics.replicas=${KAFKA_TOPICS_REPLICAS:1}
