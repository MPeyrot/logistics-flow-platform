spring.application.name=ingestion-service
server.port=${PORT:8081}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Kafka en panne : une publication échoue en ~10 s au plus (503), au lieu de garder la requête, et le sémaphore d'import,
# pendant les 60 s de max.block.ms puis les 120 s de delivery.timeout.ms par défaut.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
shipment-service.url=${SHIPMENT_SERVICE_URL:http://localhost:8080}
# L'import CSV est lancé par requête (job construit à chaque import), jamais au démarrage.
spring.batch.job.enabled=false
management.endpoints.web.exposure.include=health,info

# Nombre de répliques des topics déclarés au démarrage : 1 en local, 3 avec le profil confluent.
kafka.topics.replicas=${KAFKA_TOPICS_REPLICAS:1}

# Import CSV des scans (POST /api/scans/imports) : taille du fichier, lignes de données, attente d'un import en cours.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
ingestion.import.max-lines=10000
ingestion.import.wait=30s
