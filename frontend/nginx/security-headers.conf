# Repris dans chaque `location` qui pose un `add_header` (nginx n'hérite pas des en-têtes sinon).
# `style-src` garde 'unsafe-inline' : Angular Material pose des styles en ligne (décision du 2026-11-13). Le reste est strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
